<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โซนสินค้า</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <strong>Inventory</strong>
  <div><a href="/inventory.html">กลับหน้าหลัก</a></div>
</div>
<div class="container">
  <div class="card">
    <h1>สร้างโซนใหม่</h1>
    <label>สาขา</label>
    <select id="branch"></select>
    <label>ชื่อโซน</label>
    <input id="name" type="text" placeholder="เช่น โซน A - ของแห้ง">
    <label>คำอธิบาย</label>
    <input id="desc" type="text">
    <button onclick="create()">สร้างโซน</button>
    <div id="err" class="error"></div>
  </div>
  <div class="card">
    <h2>รายการโซนทั้งหมด</h2>
    <table id="table"><thead><tr><th>โซน</th><th>คำอธิบาย</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
requireLogin();
async function init() {
  const b = await api('/branches');
  document.getElementById('branch').innerHTML = b.items.map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  load();
}
async function load() {
  const data = await api('/zones');
  document.querySelector('#table tbody').innerHTML =
    data.items.map(z => `<tr><td>${z.name}</td><td>${z.description || '-'}</td></tr>`).join('');
}
async function create() {
  const err = document.getElementById('err');
  err.textContent = '';
  const branch_id = document.getElementById('branch').value;
  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('desc').value.trim();
  if (!name) { err.textContent = 'กรอกชื่อโซน'; return; }
  try {
    await api('/zones', { method: 'POST', body: JSON.stringify({ branch_id, name, description }) });
    document.getElementById('name').value = '';
    document.getElementById('desc').value = '';
    load();
  } catch (e) { err.textContent = e.message; }
}
init();
</script>
</body>
</html>
