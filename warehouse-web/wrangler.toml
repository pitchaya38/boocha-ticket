name = "warehouse-web"
pages_build_output_dir = "public"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "warehouse-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "warehouse-pdfs"

[vars]
JWT_SECRET = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
